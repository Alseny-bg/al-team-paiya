<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AL Team Paiya — Trouve ta prochaine sortie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
:root{--p:#6d28d9;--p2:#8b5cf6;--ink:#171321;--muted:#716b7c;--bg:#f7f6fa;--card:#fff;--line:#ece8f2;--ok:#0f9d67;--danger:#d83b58}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.wrap{max-width:1180px;margin:auto;padding:0 22px}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{height:72px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:21px}.logo{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,var(--p),var(--p2));color:white;display:grid;place-items:center;font-weight:800}.navlinks{display:flex;gap:8px}.navlinks button,.ghost{background:transparent;padding:10px 13px;color:#4f495a;border-radius:10px}.navlinks button:hover,.ghost:hover{background:#f1eef7}.primary{background:var(--p);color:#fff;padding:11px 16px;border-radius:11px;font-weight:700}.primary:hover{background:#5b21b6}.hero{padding:58px 0 35px;display:grid;grid-template-columns:1.15fr .85fr;gap:35px;align-items:center}.hero h1{font-size:52px;line-height:1.02;margin:0 0 18px;letter-spacing:-2px}.hero h1 span{color:var(--p)}.hero p{font-size:18px;line-height:1.6;color:var(--muted);max-width:620px}.search{display:flex;gap:10px;margin-top:25px}.search input{flex:1;padding:15px 17px;border:1px solid var(--line);border-radius:13px;background:#fff;outline:none}.search input:focus{border-color:var(--p2);box-shadow:0 0 0 4px #ede9fe}.hero-card{background:linear-gradient(145deg,#24123d,#6d28d9);color:#fff;border-radius:25px;padding:28px;min-height:290px;box-shadow:0 18px 50px #3d1b6530}.hero-card .pill{background:#ffffff1d}.pill{display:inline-flex;padding:7px 10px;border-radius:999px;background:#f0ebfa;color:var(--p);font-size:12px;font-weight:700}.hero-card h2{font-size:28px;margin:55px 0 8px}.hero-card p{color:#ddd3ed;font-size:14px}.section{padding:25px 0 55px}.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.section h2{margin:0;font-size:25px}.muted{color:var(--muted)}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.filter{padding:9px 12px;border:1px solid var(--line);background:white;border-radius:999px;color:#5c5667}.filter.active{background:#ede9fe;color:var(--p);border-color:#ddd2ff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 7px 24px #21113b08}.cover{height:155px;background:linear-gradient(135deg,#c4b5fd,#fbcfe8);display:flex;align-items:end;padding:14px}.cover span{background:#ffffffdc;padding:6px 9px;border-radius:8px;font-size:11px;font-weight:700}.body{padding:16px}.body h3{margin:0 0 8px;font-size:17px}.meta{font-size:13px;color:var(--muted);display:grid;gap:6px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.people{margin-top:13px;font-size:12px;color:#5d5667}.modal{position:fixed;inset:0;background:#160b2388;display:none;align-items:center;justify-content:center;padding:20px;z-index:30}.modal.show{display:flex}.modal-box{width:min(650px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;padding:24px}.modal-head{display:flex;justify-content:space-between;align-items:center}.close{background:#f3f1f6;width:34px;height:34px;border-radius:50%}.form{display:grid;gap:13px;margin-top:18px}.form label{font-size:12px;font-weight:700;color:#555061}.form input,.form textarea,.form select{width:100%;margin-top:6px;padding:12px;border:1px solid var(--line);border-radius:10px;outline:none;background:white}.form textarea{min-height:90px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tabs{display:flex;gap:7px;margin-bottom:20px}.tab{padding:10px 14px;border-radius:10px;background:#f2eff6;color:#5e5668}.tab.active{background:#ede9fe;color:var(--p);font-weight:700}.empty{padding:35px;text-align:center;background:white;border:1px dashed #d8d0e3;border-radius:15px;color:var(--muted)}.toast{position:fixed;right:20px;bottom:20px;background:#171321;color:#fff;padding:13px 16px;border-radius:12px;display:none;z-index:50}.toast.show{display:block}.danger{color:var(--danger)}footer{border-top:1px solid var(--line);padding:25px 0;color:var(--muted);font-size:13px}
@media(max-width:850px){.hero{grid-template-columns:1fr}.hero h1{font-size:42px}.grid{grid-template-columns:1fr 1fr}.navlinks{display:none}}
@media(max-width:560px){.grid{grid-template-columns:1fr}.two{grid-template-columns:1fr}.hero{padding-top:35px}.hero-card{display:none}}

/* AL TEAM PAIYA V2 */
body{background:linear-gradient(180deg,#faf9fc 0,#f7f5fa 55%,#fff 100%)}
.logo{box-shadow:0 8px 22px #6d28d933}
.brand{letter-spacing:-.3px}
.hero{padding-top:72px}
.hero h1{font-weight:800}
.hero-card{position:relative;overflow:hidden}
.hero-card:before,.hero-card:after{content:"";position:absolute;border-radius:50%;background:#ffffff12}
.hero-card:before{width:190px;height:190px;right:-70px;top:-70px}
.hero-card:after{width:120px;height:120px;left:-45px;bottom:-55px}
.hero-card>*{position:relative;z-index:1}
.card{transition:transform .2s ease,box-shadow .2s ease;border-color:#eeeaf4}
.card:hover{transform:translateY(-4px);box-shadow:0 16px 35px #21113b12}
.cover{position:relative;background:linear-gradient(135deg,#ddd6fe,#fce7f3 55%,#ede9fe)}
.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,#21113b18)}
.cover span{position:relative;z-index:1}
.section-head h2{letter-spacing:-.5px}
.filter{transition:.15s}
.primary{box-shadow:0 8px 18px #6d28d926}
.search input{box-shadow:0 4px 18px #21113b08}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px}
.kpi strong{display:block;font-size:22px;margin-bottom:3px}
.kpi span{font-size:12px;color:var(--muted)}
@media(max-width:650px){.kpis{grid-template-columns:1fr}.hero{padding-top:42px}}
</style>
</head>
<body>
<header><div class="wrap nav">
  <div class="brand"><div class="logo">AL</div>AL Team Paiya</div>
  <div class="navlinks">
    <button onclick="showHome()">Accueil</button><button onclick="showExplore()">Explorer</button><button onclick="openCreate()">Créer une sortie</button>
  </div>
  <div id="authNav"><button class="ghost" onclick="openAuth('login')">Se connecter</button><button class="primary" onclick="openAuth('signup')">S'inscrire</button></div>
</div></header>

<main id="app"></main>
<div id="modal" class="modal" onclick="if(event.target.id==='modal')closeModal()"><div id="modalBox" class="modal-box"></div></div>
<div id="toast" class="toast"></div>

<footer><div class="wrap">© 2026 AL Team Paiya · Des sorties, des rencontres, des souvenirs.</div></footer>

<script>
const {createClient}=supabase;
const sb=createClient(window.TEAM_PAIYA_CONFIG.supabaseUrl,window.TEAM_PAIYA_CONFIG.supabasePublishableKey);
let session=null,user=null,events=[],filter='Tous',query='';

const places=['Le Slalom','Le Network','Le Beeflor','Le Room','Footsal','Shicha Party chez Al','BBQ chez BOUBA','Shicha Party chez Alasko','Atieke Party chez Solokounboté'];
const cats=['Tous','Restaurant','Cinéma','Sport','Soirée','Jeux','Voyage','Nature'];

function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2800)}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function openModal(html){document.getElementById('modalBox').innerHTML=html;document.getElementById('modal').classList.add('show')}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmtDate(d,t){return new Date(d+'T'+(t||'00:00')).toLocaleString('fr-FR',{weekday:'short',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}
function catEmoji(c){return {Restaurant:'🍽️',Cinéma:'🎬',Sport:'⚽',Soirée:'🎉',Jeux:'🎲',Voyage:'✈️',Nature:'🌿'}[c]||'✨'}

async function load(){
  const {data:{session:s}}=await sb.auth.getSession(); session=s; user=s?.user||null;
  await loadEvents(); updateAuthNav(); showHome();
}
async function loadEvents(){
  const {data,error}=await sb.from('events').select('*, profiles:creator_id(username,full_name)').order('event_date',{ascending:true}).order('event_time',{ascending:true});
  if(error){console.error(error);events=[];return}
  const ids=(data||[]).map(x=>x.id);
  let counts={};
  if(ids.length){const {data:p}=await sb.from('event_participants').select('event_id').in('event_id',ids);(p||[]).forEach(x=>counts[x.event_id]=(counts[x.event_id]||0)+1)}
  events=(data||[]).map(e=>({...e,count:counts[e.id]||0}));
}
function updateAuthNav(){
  document.getElementById('authNav').innerHTML=user?
    `<button class="ghost" onclick="showProfile()">Mon profil</button><button class="primary" onclick="logout()">Déconnexion</button>`:
    `<button class="ghost" onclick="openAuth('login')">Se connecter</button><button class="primary" onclick="openAuth('signup')">S'inscrire</button>`;
}
function card(e){
 return `<article class="card"><div class="cover"><span>${catEmoji(e.category)} ${esc(e.category)}</span></div><div class="body">
   <div class="row"><span class="pill">${esc(e.place)}</span><span class="muted">${esc(e.city)}</span></div>
   <h3>${esc(e.title)}</h3><div class="meta"><div>📅 ${fmtDate(e.event_date,e.event_time)}</div><div>👤 ${e.count}/${e.max_participants} participants</div><div>💜 Gratuit</div></div>
   <button class="primary" style="width:100%;margin-top:14px" onclick="showEvent('${e.id}')">Voir la sortie</button>
 </div></article>`
}
function filtered(){
 return events.filter(e=>(filter==='Tous'||e.category===filter)&&(!query||[e.title,e.place,e.city,e.description].join(' ').toLowerCase().includes(query.toLowerCase())));
}
function showHome(){
 const featured=events.slice(0,6);
 document.getElementById('app').innerHTML=`<div class="wrap">
 <section class="hero"><div><span class="pill">✨ La plateforme des sorties entre amis</span><h1>On sort ?<br><span>Team Paiya.</span></h1><p>Découvre des sorties, rejoins un groupe et crée tes propres moments. Simple, gratuit et pensé pour se retrouver.</p>
 <div class="kpis">
 <div class="kpi"><strong>100%</strong><span>sorties gratuites au lancement</span></div>
 <div class="kpi"><strong>9+</strong><span>lieux Team Paiya disponibles</span></div>
 <div class="kpi"><strong>1 clic</strong><span>pour rejoindre une sortie</span></div>
</div>
<div class="search"><input id="homeSearch" placeholder="Restaurant, sport, Lille..." value="${esc(query)}"><button class="primary" onclick="doSearch()">Rechercher</button></div></div>
 <div class="hero-card"><span class="pill">TEAM PAIYA</span><h2>Plus de sorties.<br>Plus de rencontres.</h2><p>Choisis une activité, regarde qui participe et rejoins automatiquement la sortie.</p><button class="primary" style="background:white;color:#5b21b6" onclick="showExplore()">Explorer les sorties →</button></div></section>
 <section class="section"><div class="section-head"><div><h2>Comment ça marche ?</h2><div class="muted">Simple, rapide, social.</div></div></div>
 <div class="grid">
  <article class="card"><div class="body"><span class="pill">01</span><h3>🔎 Trouve une sortie</h3><div class="muted">Choisis une activité et regarde les prochaines sorties près de toi.</div></div></article>
  <article class="card"><div class="body"><span class="pill">02</span><h3>🤝 Rejoins le groupe</h3><div class="muted">Un clic suffit pour participer, dans la limite des places disponibles.</div></div></article>
  <article class="card"><div class="body"><span class="pill">03</span><h3>🎉 Profite du moment</h3><div class="muted">Retrouve les participants et partage une vraie expérience.</div></div></article>
 </div></section>
 <section class="section"><div class="section-head"><div><h2>Les prochaines sorties</h2><div class="muted">Les bons plans du moment</div></div><button class="ghost" onclick="showExplore()">Tout voir →</button></div>
 <div class="grid">${featured.length?featured.map(card).join(''):'<div class="empty" style="grid-column:1/-1">Aucune sortie pour le moment. Sois le premier à en créer une !</div>'}</div></section>
 </div>`;
}
function showExplore(){
 document.getElementById('app').innerHTML=`<div class="wrap"><section class="section"><div class="section-head"><div><h2>Explorer les sorties</h2><div class="muted">${filtered().length} sortie(s) disponible(s)</div></div><button class="primary" onclick="openCreate()">+ Créer</button></div>
 <div class="search"><input id="exploreSearch" placeholder="Rechercher une sortie..." value="${esc(query)}" oninput="query=this.value;renderExplore()"></div>
 <div class="filters">${cats.map(c=>`<button class="filter ${filter===c?'active':''}" onclick="filter='${c}';renderExplore()">${c}</button>`).join('')}</div>
 <div id="exploreGrid" class="grid"></div></section></div>`;renderExplore()
}
function renderExplore(){const g=document.getElementById('exploreGrid');if(!g)return;const f=filtered();g.innerHTML=f.length?f.map(card).join(''):'<div class="empty" style="grid-column:1/-1">Aucune sortie ne correspond à ta recherche.</div>'}
function doSearch(){query=document.getElementById('homeSearch').value;showExplore()}

function openAuth(mode='login'){
 openModal(`<div class="modal-head"><div><h2 style="margin:0">${mode==='login'?'Bon retour 👋':'Bienvenue dans Team Paiya 🎉'}</h2><div class="muted">${mode==='login'?'Connecte-toi pour rejoindre des sorties.':'Crée ton compte gratuitement.'}</div></div><button class="close" onclick="closeModal()">×</button></div>
 <form class="form" onsubmit="authSubmit(event,'${mode}')">
 ${mode==='signup'?'<label>Nom complet<input id="fullName" required placeholder="Ex. Alseny Bangoura"></label><label>Pseudo<input id="username" required placeholder="Ex. Alseny"></label>':''}
 <label>Email<input id="email" type="email" required placeholder="ton@email.com"></label>
 <label>Mot de passe<input id="password" type="password" minlength="6" required placeholder="6 caractères minimum"></label>
 <button class="primary" type="submit">${mode==='login'?'Se connecter':'Créer mon compte'}</button>
 <button type="button" class="ghost" onclick="openAuth('${mode==='login'?'signup':'login'}')">${mode==='login'?'Créer un compte':'J’ai déjà un compte'}</button>
 </form>`);
}
async function authSubmit(ev,mode){ev.preventDefault();const email=document.getElementById('email').value,password=document.getElementById('password').value;
 let res;
 if(mode==='signup'){const full_name=document.getElementById('fullName').value,username=document.getElementById('username').value;res=await sb.auth.signUp({email,password,options:{data:{full_name,username}}})}
 else res=await sb.auth.signInWithPassword({email,password});
 if(res.error){toast(res.error.message);return}
 if(mode==='signup'&&!res.data.session){toast('Compte créé. Vérifie ton email si la confirmation est activée.');closeModal();return}
 session=res.data.session;user=session.user;updateAuthNav();closeModal();await loadEvents();showHome();toast('Connexion réussie !')
}
async function logout(){await sb.auth.signOut();user=null;session=null;updateAuthNav();showHome();toast('À bientôt 👋')}

async function showEvent(id){
 const e=events.find(x=>x.id===id);if(!e)return;
 let joined=false;
 if(user){const {data}=await sb.from('event_participants').select('user_id').eq('event_id',id).eq('user_id',user.id);joined=!!data?.length}
 const {data:parts}=await sb.from('event_participants').select('user_id, profiles(username,full_name)').eq('event_id',id);
 openModal(`<div class="modal-head"><div><span class="pill">${catEmoji(e.category)} ${esc(e.category)}</span><h2 style="margin:10px 0 4px">${esc(e.title)}</h2><div class="muted">${esc(e.place)} · ${esc(e.city)}</div></div><button class="close" onclick="closeModal()">×</button></div>
 <p style="line-height:1.6;color:#5f5968">${esc(e.description||'Pas de description.')}</p>
 <div class="meta" style="background:#f8f6fb;padding:14px;border-radius:12px"><div>📅 ${fmtDate(e.event_date,e.event_time)}</div><div>👥 ${e.count}/${e.max_participants} participants</div><div>💜 Gratuit</div><div>Créée par ${esc(e.profiles?.full_name||e.profiles?.username||'membre')}</div></div>
 <h3>Participants</h3><div>${(parts||[]).length?parts.map(p=>`<span class="pill" style="margin:3px">${esc(p.profiles?.full_name||p.profiles?.username||'Membre')}</span>`).join(''):'<span class="muted">Sois le premier à rejoindre !</span>'}</div>
 ${user?(joined?'<button class="primary" style="width:100%;margin-top:18px" disabled>✓ Tu participes</button>:(e.count>=e.max_participants?'<button class="primary" style="width:100%;margin-top:18px" disabled>Sortie complète</button>':`<button class="primary" style="width:100%;margin-top:18px" onclick="join('${e.id}')">Rejoindre la sortie</button>`)):'<button class="primary" style="width:100%;margin-top:18px" onclick="closeModal();openAuth('login')">Connecte-toi pour rejoindre</button>'}
 </div>`)
}
async function join(id){
 if(!user){closeModal();openAuth('login');return}
 const {data,error}=await sb.rpc('join_event',{p_event_id:id});
 if(error){toast(error.message.includes('EVENT_FULL')?'Cette sortie est complète.':error.message);return}
 await loadEvents();closeModal();showEvent(id);toast('Tu participes maintenant à la sortie 🎉')
}

function openCreate(){
 if(!user){openAuth('login');return}
 openModal(`<div class="modal-head"><div><h2 style="margin:0">Créer une sortie</h2><div class="muted">Propose un moment à la Team Paiya.</div></div><button class="close" onclick="closeModal()">×</button></div>
 <form class="form" onsubmit="createEvent(event)">
 <label>Nom de la sortie<input id="title" required placeholder="Ex. Soirée Footsal"></label>
 <label>Catégorie<select id="category">${cats.slice(1).map(c=>`<option>${c}</option>`).join('')}</select></label>
 <label>Lieu<select id="place">${places.map(p=>`<option>${esc(p)}</option>`).join('')}<option value="__custom">Autre lieu...</option></select></label>
 <label id="customWrap" style="display:none">Lieu personnalisé<input id="customPlace" placeholder="Nom du lieu"></label>
 <div class="two"><label>Ville<input id="city" value="Lille" required></label><label>Participants max<input id="max" type="number" min="2" value="10" required></label></div>
 <div class="two"><label>Date<input id="date" type="date" required></label><label>Heure<input id="time" type="time" required></label></div>
 <label>Description<textarea id="description" placeholder="Décris rapidement la sortie..."></textarea></label>
 <button class="primary" type="submit">Créer la sortie</button>
 </form>`);
 document.getElementById('place').onchange=e=>document.getElementById('customWrap').style.display=e.target.value==='__custom'?'block':'none';
}
async function createEvent(ev){ev.preventDefault();let place=document.getElementById('place').value;if(place==='__custom')place=document.getElementById('customPlace').value.trim();if(!place)return;
 const payload={creator_id:user.id,title:document.getElementById('title').value.trim(),description:document.getElementById('description').value.trim(),category:document.getElementById('category').value,place,city:document.getElementById('city').value.trim(),event_date:document.getElementById('date').value,event_time:document.getElementById('time').value,price:0,max_participants:+document.getElementById('max').value};
 const {error}=await sb.from('events').insert(payload);if(error){toast(error.message);return}closeModal();await loadEvents();showExplore();toast('Sortie créée 🎉')
}

async function showProfile(){
 if(!user)return;
 const {data:p}=await sb.from('profiles').select('*').eq('id',user.id).single();
 const {data:joined}=await sb.from('event_participants').select('event_id, events(*)').eq('user_id',user.id);
 const mine=events.filter(e=>e.creator_id===user.id);
 const joinedIds=(joined||[]).map(x=>x.event_id);const joinedEvents=events.filter(e=>joinedIds.includes(e.id));
 document.getElementById('app').innerHTML=`<div class="wrap"><section class="section"><div class="row"><div><span class="pill">MON ESPACE</span><h2 style="margin:10px 0">${esc(p?.full_name||p?.username||'Membre Team Paiya')}</h2><div class="muted">@${esc(p?.username||'membre')} · ${esc(p?.city||'')}</div></div><button class="primary" onclick="editProfile()">Modifier mon profil</button></div>
 <p class="muted" style="max-width:650px">${esc(p?.bio||'Ajoute une petite bio pour te présenter à la Team Paiya.')}</p>
 <div class="tabs"><button class="tab active">Mes sorties (${mine.length})</button><button class="tab">Je participe (${joinedEvents.length})</button></div>
 <h3>Sorties créées</h3><div class="grid">${mine.length?mine.map(card).join(''):'<div class="empty" style="grid-column:1/-1">Tu n’as encore créé aucune sortie.</div>'}</div>
 <h3 style="margin-top:35px">Sorties rejointes</h3><div class="grid">${joinedEvents.length?joinedEvents.map(card).join(''):'<div class="empty" style="grid-column:1/-1">Tu ne participes encore à aucune sortie.</div>'}</div>
 </section></div>`;
}
function editProfile(){
 openModal(`<div class="modal-head"><h2 style="margin:0">Modifier mon profil</h2><button class="close" onclick="closeModal()">×</button></div>
 <form class="form" onsubmit="saveProfile(event)"><label>Nom complet<input id="pfname" value="${esc(user.user_metadata?.full_name||'')}"></label>
 <label>Ville<input id="pcity" value="Lille"></label><label>Bio<textarea id="pbio" placeholder="Quelques mots sur toi..."></textarea></label>
 <button class="primary">Enregistrer</button></form>`);
}
async function saveProfile(ev){ev.preventDefault();const payload={full_name:document.getElementById('pfname').value,city:document.getElementById('pcity').value,bio:document.getElementById('pbio').value};const {error}=await sb.from('profiles').update(payload).eq('id',user.id);if(error){toast(error.message);return}closeModal();showProfile();toast('Profil mis à jour')}
sb.auth.onAuthStateChange(async(_event,s)=>{session=s;user=s?.user||null;updateAuthNav();if(_event==='SIGNED_IN'){await loadEvents();showHome()}});
